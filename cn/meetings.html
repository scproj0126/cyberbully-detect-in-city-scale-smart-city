  <section class="page-header">
    <div class="container">
      <h1>会议记录</h1>
      <p class="subtitle">按教学周整理（含录音、幻灯片与讨论记录）。暂无材料的周次仍链接至 GitHub 会议文件夹，后续更新后可直接访问。</p>
    </div>
  </section>

  <main class="container">
    <section class="week-board">
      <div class="board-title">
        <div class="left">📌 每周会议记录</div>
        <div class="right" id="currentLabel">当前周次：—</div>
      </div>

      <ul class="week-list" id="weekList"></ul>
    </section>
  </main>

  <script>
    // 会议文件夹路径
    const MEETINGS_URL = "https://github.com/scproj0126/cyberbully-detect-in-city-scale-smart-city/tree/main/meetings";

    // 各周日期设置
    const weeks = [
      { week: 1,  start: "2026-01-12", end: "2026-01-18" },
      { week: 2,  start: "2026-01-19", end: "2026-01-25" },
      { week: 3,  start: "2026-01-26", end: "2026-02-01" },
      { week: 4,  start: "2026-02-02", end: "2026-02-08" },
      { week: 5,  start: "2026-02-09", end: "2026-02-15" },
      { week: 6,  start: "2026-02-16", end: "2026-02-22" },
      { week: 7,  start: "2026-02-23", end: "2026-03-01" },
      { week: 8,  start: "2026-03-02", end: "2026-03-08" },
      { week: 9,  start: "2026-03-09", end: "2026-03-15" },
      { week: 10, start: "2026-03-16", end: "2026-03-22" },
      { week: 11, start: "2026-03-23", end: "2026-03-29" },
      { week: 12, start: "2026-03-30", end: "2026-04-05" },
      { week: 13, start: "2026-04-06", end: "2026-04-12" },
      { week: 14, start: "2026-04-13", end: "2026-04-19" },
      { week: 15, start: "2026-04-20", end: "2026-04-26" },
      { week: 16, start: "2026-04-27", end: "2026-05-03" }
    ];

    function toLocalMidnight(d){
      const x = new Date(d);
      x.setHours(0,0,0,0);
      return x;
    }

    function parseISOStart(iso){
      return new Date(iso + "T00:00:00");
    }
    function parseISOEnd(iso){
      return new Date(iso + "T23:59:59");
    }

    function getStatus(today, w){
      const s = parseISOStart(w.start);
      const e = parseISOEnd(w.end);

      if (today > e) return "done";
      if (today >= s && today <= e) return "current";
      return "upcoming";
    }

    (function render(){
      const list = document.getElementById("weekList");
      const currentLabel = document.getElementById("currentLabel");
      const today = toLocalMidnight(new Date());

      let currentWeekNum = null;

      // 第一次遍历：确定当前周次
      for (const w of weeks){
        const status = getStatus(today, w);
        if (status === "current"){
          currentWeekNum = w.week;
          break;
        }
      }

      currentLabel.textContent = currentWeekNum ? `当前周次：第 ${currentWeekNum} 周` : "当前周次：已结束（共 16 周）";

      // 渲染列表
      list.innerHTML = "";
      for (const w of weeks){
        const status = getStatus(today, w);

        const badgeText = status === "done"    ? "已完成"
                        : status === "current" ? "本周"
                        : "即将开始";

        const li = document.createElement("li");
        li.className = "week-card" + (status === "current" ? " current" : "");

        li.innerHTML = `
          <div class="week-left">
            <div class="week-title">第 ${w.week} 周</div>
            <div class="badge ${status}">${badgeText}</div>
          </div>
          <div class="week-actions">
            <a class="btn ${status === "current" ? "primary" : ""}" href="${MEETINGS_URL}" target="_blank" rel="noopener noreferrer">
              查看会议文件 ↗
            </a>
          </div>
        `;

        list.appendChild(li);
      }
    })();
  </script>

  <!-- ================= Footer ================= -->
  <footer class="footer">

  </footer>
</body>
