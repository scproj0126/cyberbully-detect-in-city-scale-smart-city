<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>会议记录 | CDS553 网络欺凌检测项目</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
  
  <style>
    .container{ max-width: 980px; margin: 0 auto; padding: 0 20px; }

    .page-header{
      margin: 28px 0 16px;
    }
    .page-header h1{
      margin: 0 0 8px;
      font-size: 2.2rem;
      letter-spacing: 0.2px;
    }
    .page-header p{
      margin: 0;
      color: #666;
      max-width: 720px;
      line-height: 1.6;
    }

    .week-board{
      margin: 18px 0 36px;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.04);
    }

    .board-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .board-title .left{
      display:flex;
      align-items:center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .board-title .right{
      color:#777;
      font-size: 0.95rem;
    }

    .week-list{
      display:flex;
      flex-direction:column;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .week-card{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
      padding: 14px 14px;
      border-radius: 14px;
      background: #f6f6f6;
      border: 1px solid #eee;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .week-card:hover{
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(0,0,0,0.06);
    }

    .week-left{
      display:flex;
      align-items:center;
      gap: 12px;
      min-width: 0;
    }

    .week-title{
      font-weight: 700;
      font-size: 1rem;
      white-space: nowrap;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      border: 1px solid #e6e6e6;
      background: #fff;
      color:#666;
      user-select:none;
      white-space: nowrap;
    }
    .badge.done{ opacity: 0.95; }
    .badge.current{
      border-color: rgba(123, 92, 255, 0.35);
      background: rgba(123, 92, 255, 0.08);
      color: #3b2fb7;
      font-weight: 700;
    }
    .badge.upcoming{ opacity: 0.75; }

    .week-card.current{
      border-color: rgba(123, 92, 255, 0.35);
      background: linear-gradient(180deg, rgba(123,92,255,0.08), rgba(123,92,255,0.04));
    }

    .week-actions{
      display:flex;
      align-items:center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      text-decoration:none;
      font-weight: 600;
      border: 1px solid #ddd;
      background: #fff;
      color: #222;
    }
    .btn:hover{ border-color:#cfcfcf; }

    .btn.primary{
      border-color: rgba(123, 92, 255, 0.45);
      background: rgba(123, 92, 255, 0.10);
      color: #3b2fb7;
    }

    .hint{
      margin-top: 14px;
      color:#777;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    @media (max-width: 768px){
      .page-header h1{ font-size: 1.6rem; }
      .week-card{ align-items:flex-start; flex-direction: column; }
      .week-actions{ width: 100%; justify-content:flex-end; }
      .btn{ width: 100%; justify-content:center; }
    }
  </style>
</head>

<body>
  <!-- Navigation -->
  <header class="navbar">
    <div class="nav-left">
      <span class="logo">CDS553课程项目：网络欺凌检测</span>
    </div>
    <nav class="nav-right">
      <a href="../cn/index.html">项目主页</a>
      <a href="../cn/about.html">关于我们</a>
      <a href="../cn/meetings.html">会议记录</a>
      <a href="../cn/resources.html">项目资源</a>

      <div class="lang-menu">
        <button class="lang-btn" aria-haspopup="true">
          语言 ▾
        </button>
        <div class="lang-dropdown" role="menu">
          <a href="../meetings.html">English</a>
          <a href="./meetings.html">中文</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="page-header">
      <h1>会议记录</h1>
    </section>

    <section class="week-board">
      <div class="board-title">
        <div class="left">📌 Weekly Meeting Notes</div>
        <div class="right" id="currentLabel">当前周：—</div>
      </div>

      <ul class="week-list" id="weekList"></ul>

    </section>
  </main>

  <script>
    // Edit here for the meeting file folder path
    const MEETINGS_URL = "https://github.com/scproj0126/cyberbully-detect-in-city-scale-smart-city/tree/main/meetings";

    // Week date setting
    const weeks = [
      { week: 1,  start: "2026-01-12", end: "2026-01-18" },
      { week: 2,  start: "2026-01-19", end: "2026-01-25" },
      { week: 3,  start: "2026-01-26", end: "2026-02-01" },
      { week: 4,  start: "2026-02-02", end: "2026-02-08" },
      { week: 5,  start: "2026-02-09", end: "2026-02-15" },
      { week: 6,  start: "2026-02-16", end: "2026-02-22" },
      { week: 7,  start: "2026-02-23", end: "2026-03-01" },
      { week: 8,  start: "2026-03-02", end: "2026-03-08" },
      { week: 9,  start: "2026-03-09", end: "2026-03-15" },
      { week: 10, start: "2026-03-16", end: "2026-03-22" },
      { week: 11, start: "2026-03-23", end: "2026-03-29" },
      { week: 12, start: "2026-03-30", end: "2026-04-05" },
      { week: 13, start: "2026-04-06", end: "2026-04-12" },
      { week: 14, start: "2026-04-13", end: "2026-04-19" },
      { week: 15, start: "2026-04-20", end: "2026-04-26" },
      { week: 16, start: "2026-04-27", end: "2026-05-03" }
    ];

    function toLocalMidnight(d){
      const x = new Date(d);
      x.setHours(0,0,0,0);
      return x;
    }

    function parseISOStart(iso){
      return new Date(iso + "T00:00:00");
    }
    function parseISOEnd(iso){
      return new Date(iso + "T23:59:59");
    }

    function getStatus(today, w){
      const s = parseISOStart(w.start);
      const e = parseISOEnd(w.end);

      if (today > e) return "done";
      if (today >= s && today <= e) return "current";
      return "upcoming";
    }

    (function render(){
      const list = document.getElementById("weekList");
      const currentLabel = document.getElementById("currentLabel");
      const today = toLocalMidnight(new Date());

      let currentWeekNum = null;

      // first pass: find current week
      for (const w of weeks){
        const status = getStatus(today, w);
        if (status === "current"){
          currentWeekNum = w.week;
          break;
        }
      }

      currentLabel.textContent = currentWeekNum ? `当前周：Week ${currentWeekNum}` : "当前周：—";

      // render
      list.innerHTML = "";
      for (const w of weeks){
        const status = getStatus(today, w);

        const badgeText = status === "done" ? "Done"
                        : status === "current" ? "Current week"
                        : "Upcoming";

        const li = document.createElement("li");
        li.className = "week-card" + (status === "current" ? " current" : "");

        li.innerHTML = `
          <div class="week-left">
            <div class="week-title">Week ${w.week}</div>
            <div class="badge ${status}">${badgeText}</div>
          </div>
          <div class="week-actions">
            <a class="btn ${status === "current" ? "primary" : ""}" href="${MEETINGS_URL}" target="_blank" rel="noopener noreferrer">
              浏览会议文件 ↗
            </a>
          </div>
        `;

        list.appendChild(li);
      }
    })();
  </script>
  
</body>
</html>
